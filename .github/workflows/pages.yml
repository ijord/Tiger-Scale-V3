name: pages

# Redeploy the installer page WITHOUT cutting a firmware release.
#
# Most commits here are text: a clearer sentence, a new explanation, a replaced
# asset. None of that justifies bumping TIGERSCALE_FW_VERSION — a version that
# moves without the firmware moving is a claim every scale in the field acts on.
#
# The site is assembled around the LATEST PUBLISHED RELEASE, never around
# whatever happens to be live. That distinction is the whole design, and it was
# learned the hard way: an earlier version copied version.json off the live site,
# which meant it could only ever republish what was already there. When the
# release workflow and this one both deployed for the same commit, the site was
# left serving the older of the two and the new release became invisible to every
# scale — they kept seeing the previous version. Deriving from the release
# removes the ordering question: run this before or after a release and it
# produces the same, correct site.
#
# Nothing is rebuilt. The app images are the release assets themselves, so the
# SHA-256 sums in version.json are the hashes of the exact bytes the OTA will
# download — correct by construction rather than by hope. otaApply() verifies
# that hash before switching the boot partition, so a rebuilt binary would be
# downloaded and then rejected by every scale in the field.
#
# Firmware changes still go through release.yml and a tag. This is only the page.

# The ONLY thing in this repository that deploys Pages. release.yml deliberately
# does not, because two deployers racing for the same commit is what broke it.
on:
  # Called by release.yml once it has published, which is what carries a new
  # firmware version to the scales.
  #
  # It is `workflow_call` and not `release: published` for a reason that costs a
  # release to learn: GitHub does not raise triggering events for anything created
  # with the built-in GITHUB_TOKEN. release.yml publishes with that token, so a
  # `release` trigger here would sit silently and never fire — which is exactly
  # what happened to v3.1.3. Being called runs inside the caller's own run, so no
  # event needs to be raised at all.
  workflow_call:
  # Page-only edits, which need no release at all.
  push:
    branches: [main]
    paths:
      # Not llms.txt, although it is published: every release commit edits its
      # "reviewed against" line, so a trigger here starts a second deployment
      # beside release.yml's for the same commit. That is what left v3.9.0's site
      # advertising v3.8.1. An llms.txt edit goes live with the hourly run below.
      - 'web-installer/**'
      - '.github/workflows/pages.yml'
      - 'scripts/fetch-published-site.py'
      - 'scripts/make-manifest.py'
  # Safety net. If a deployment is ever silently lost again, this repairs it
  # within the hour instead of leaving every scale told it is up to date.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with release.yml's deploy job: two Pages deployments for the same commit
# is exactly what broke this once.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

env:
  PAGES_URL: https://ijord.github.io/Tiger-Scale-V3
  # The build behind the flat OTA keys — the ESP32-S3-Touch-LCD-3.5B, which is
  # what every scale in the field is. make-manifest.py refuses anything else.
  OTA_ENV: esp32s3_hsu_b
  # Additional boards, each with its own entry in boards[].
  OTHER_BOARDS: "3.5:esp32s3_hsu jc3248w535:jc3248w535_hsu"

jobs:
  redeploy:
    name: redeploy the installer page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Is the live site already current?
        id: state
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             && python3 scripts/verify-published-site.py --repo "$GITHUB_REPOSITORY" --pages "$PAGES_URL" --quiet; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to repair."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble around the latest release
        if: steps.state.outputs.skip != 'true'
        id: assemble
        run: |
          set -euo pipefail
          python3 scripts/fetch-published-site.py --repo "$GITHUB_REPOSITORY" --pages "$PAGES_URL" --out pages | tee assemble.log
          VERSION=$(grep -oE '^version=.+' assemble.log | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The manifest is regenerated from the release assets that were just
          # downloaded, so every hash in it is the hash of a published byte.
          python3 scripts/make-manifest.py \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --ota-env "$OTA_ENV" \
            --dist pages/dist \
            --web-installer pages \
            --out pages/version.json

          # dist/ was only a staging area for the hashing; the factory images are
          # already on the release and do not need a second home.
          rm -rf pages/dist

          # The page itself is whatever is in the working tree. It cannot clobber
          # the above: web-installer/ holds no version.json, no manifest-*.json
          # and no firmware/ directory.
          cp -R web-installer/. pages/
          # llms.txt has one copy, at the repository root, because that is the one
          # check-llms-txt.py holds true. A second copy under web-installer/ was
          # what got published, and it went on describing a build matrix that no
          # longer existed while the checked one stayed current.
          cp llms.txt pages/llms.txt
          echo "--- pages/ ---"; find pages -type f | sort

      - name: The manifest must describe the release it claims
        if: steps.state.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.assemble.outputs.version }}
        run: |
          set -euo pipefail
          # Prove the published binary and the hash we are about to advertise are
          # the same object. If these ever disagree, every scale downloads the
          # update and rejects it at the final check — silently, and only in the
          # field.
          SAID=$(python3 -c "import json;print(json.load(open('pages/version.json'))['firmware_sha'])")
          GOT=$(sha256sum "pages/firmware/firmware-$OTA_ENV.bin" | cut -d' ' -f1)
          SAY_V=$(python3 -c "import json;print(json.load(open('pages/version.json'))['version'])")

          echo "manifest version : $SAY_V (expected $VERSION)"
          echo "manifest sha     : $SAID"
          echo "served binary    : $GOT"

          [ "$SAY_V" = "$VERSION" ] || { echo "::error::version mismatch"; exit 1; }
          [ "$SAID"  = "$GOT"     ] || { echo "::error::the manifest hash is not the hash of the binary being served"; exit 1; }

          # Additional boards must receive their own firmware, never the flat
          # default image or another board's binary.
          SEEN="$GOT"
          for pair in $OTHER_BOARDS; do
            BOARD="${pair%%:*}"
            BUILD="${pair#*:}"
            BOARD_SAID=$(python3 -c "import json,sys;print(json.load(open('pages/version.json'))['boards'][sys.argv[1]]['firmware_sha'])" "$BOARD")
            BOARD_GOT=$(sha256sum "pages/firmware/firmware-$BUILD.bin" | cut -d' ' -f1)
            [ "$BOARD_SAID" = "$BOARD_GOT" ] || { echo "::error::$BOARD manifest does not match its binary"; exit 1; }
            [[ " $SEEN " != *" $BOARD_GOT "* ]] || { echo "::error::$BOARD has another board's image"; exit 1; }
            SEEN="$SEEN $BOARD_GOT"
          done
          echo "OK — the manifest describes exactly what is being served, per board."

      - uses: actions/upload-pages-artifact@v3
        if: steps.state.outputs.skip != 'true'
        with:
          path: pages/

      - id: deploy
        if: steps.state.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      # Deploying is not the same as being served. GitHub reported success on the
      # deployment that was then silently ignored, so the only trustworthy signal
      # is fetching the site back and comparing it to the release.
      - name: Prove the live site now serves that release
        if: steps.state.outputs.skip != 'true'
        run: python3 scripts/verify-published-site.py --repo "$GITHUB_REPOSITORY" --pages "$PAGES_URL" --wait 300
